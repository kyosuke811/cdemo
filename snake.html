<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>スネークゲーム</title>
  <style>
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: monospace;
      color: #eee;
    }
    h1 { margin-bottom: 8px; font-size: 1.5rem; letter-spacing: 4px; }
    #score { margin-bottom: 12px; font-size: 1.1rem; }
    canvas {
      border: 2px solid #e94560;
      background: #0f3460;
      display: block;
    }
    #msg {
      margin-top: 14px;
      font-size: 0.95rem;
      color: #aaa;
    }
    #overlay {
      position: absolute;
      background: rgba(0,0,0,0.75);
      color: #fff;
      font-size: 1.4rem;
      padding: 20px 36px;
      border-radius: 8px;
      text-align: center;
      display: none;
    }
    #overlay button {
      margin-top: 14px;
      padding: 8px 24px;
      background: #e94560;
      border: none;
      color: #fff;
      font-size: 1rem;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>SNAKE</h1>
  <div id="score">スコア: 0</div>
  <canvas id="c" width="400" height="400"></canvas>
  <div id="msg">矢印キー or WASD で操作</div>
  <div id="overlay">
    <div id="overlay-text"></div>
    <button onclick="startGame()">スタート</button>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayText = document.getElementById('overlay-text');
    const scoreEl = document.getElementById('score');

    const SIZE = 20;
    const COLS = canvas.width / SIZE;
    const ROWS = canvas.height / SIZE;

    let snake, dir, nextDir, food, score, loop;

    function startGame() {
      overlay.style.display = 'none';
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      scoreEl.textContent = 'スコア: 0';
      placeFood();
      clearInterval(loop);
      loop = setInterval(tick, 120);
    }

    function placeFood() {
      let pos;
      do {
        pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      food = pos;
    }

    function tick() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // 壁衝突
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();
      // 自分に衝突
      if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = `スコア: ${score}`;
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // グリッド (淡く)
      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      for (let i = 0; i < COLS; i++) {
        ctx.beginPath(); ctx.moveTo(i * SIZE, 0); ctx.lineTo(i * SIZE, canvas.height); ctx.stroke();
      }
      for (let j = 0; j < ROWS; j++) {
        ctx.beginPath(); ctx.moveTo(0, j * SIZE); ctx.lineTo(canvas.width, j * SIZE); ctx.stroke();
      }

      // エサ
      ctx.fillStyle = '#e94560';
      ctx.beginPath();
      ctx.arc(food.x * SIZE + SIZE / 2, food.y * SIZE + SIZE / 2, SIZE / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // スネーク
      snake.forEach((seg, i) => {
        const ratio = 1 - i / snake.length * 0.6;
        ctx.fillStyle = `rgba(83, 221, 108, ${ratio})`;
        ctx.fillRect(seg.x * SIZE + 1, seg.y * SIZE + 1, SIZE - 2, SIZE - 2);
      });

      // 頭の目
      const h = snake[0];
      ctx.fillStyle = '#0f3460';
      const eyeOffset = dir.x !== 0
        ? [{ dx: 0.55, dy: -0.2 }, { dx: 0.55, dy: 0.2 }]
        : [{ dx: -0.2, dy: 0.55 }, { dx: 0.2, dy: 0.55 }];
      eyeOffset.forEach(e => {
        ctx.beginPath();
        ctx.arc(
          (h.x + 0.5 + dir.x * e.dx + (dir.y !== 0 ? e.dx : 0)) * SIZE,
          (h.y + 0.5 + dir.y * e.dy + (dir.x !== 0 ? 0 : e.dy)) * SIZE,
          2.5, 0, Math.PI * 2
        );
        ctx.fill();
      });
    }

    function gameOver() {
      clearInterval(loop);
      overlayText.textContent = `ゲームオーバー\nスコア: ${score}`;
      overlay.style.display = 'flex';
      overlay.style.flexDirection = 'column';
      overlay.style.alignItems = 'center';
    }

    document.addEventListener('keydown', e => {
      const keys = {
        ArrowUp: { x: 0, y: -1 }, w: { x: 0, y: -1 },
        ArrowDown: { x: 0, y: 1 }, s: { x: 0, y: 1 },
        ArrowLeft: { x: -1, y: 0 }, a: { x: -1, y: 0 },
        ArrowRight: { x: 1, y: 0 }, d: { x: 1, y: 0 },
      };
      const d = keys[e.key];
      if (d && !(d.x === -dir.x && d.y === -dir.y)) {
        nextDir = d;
        e.preventDefault();
      }
    });

    // 初期画面
    overlayText.textContent = 'スネークゲーム';
    overlay.style.display = 'flex';
    overlay.style.flexDirection = 'column';
    overlay.style.alignItems = 'center';
  </script>
</body>
</html>
